<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FBF6F1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanessa Training Log">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Vanessa — Training Log</title>
<style>
:root{
  /* Vanessa palette: SOFT · PEACH · DISCO · GOLDIE · CORAL · FIERY · OPAL · STARBOARD */
  --soft:#F6EDE5; --peach:#F9D8CF; --disco:#F5A0DC; --goldie:#C9990F;
  --coral:#F9B49C; --fiery:#F4714C; --opal:#A9D2CA; --star:#2D5F5D;

  --bg:#FBF6F1; --bg-2:#F6EDE5; --panel:#FFFFFF; --panel-2:#FBF6F1;
  --line:#EADFD4; --line-2:#DCCEC1;
  --chalk:#2D3A3A; --dim:#6E7E7D; --dimmer:#9AA6A5;
  --brass:var(--goldie); --brass-2:#E0B44A; --brass-dk:#8A6A0B;
  --amber:var(--fiery); --cyan:var(--star);
  --go:#3F8F72; --hot:#E05A4B; --ice:var(--star);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;padding:0 0 92px;background:var(--bg);color:var(--chalk);font-family:var(--sans);
  max-width:680px;margin:0 auto;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}

/* ── masthead ── */
header{position:sticky;top:0;z-index:30;background:rgba(251,246,241,.95);backdrop-filter:saturate(140%) blur(10px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.mast{display:flex;align-items:baseline;justify-content:space-between;padding:13px 18px 9px}
.mast .t{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.005em;transition:opacity .2s;color:var(--star)}
.mast .t.hide{opacity:0;pointer-events:none}
.mast .t em{font-style:italic;color:var(--brass);font-weight:400}
.mast .d{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.06em;text-transform:uppercase}
.rule{height:2px;background:linear-gradient(90deg,var(--fiery),var(--disco) 45%,var(--opal) 75%,transparent);margin:0 18px}
nav{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px}
nav::-webkit-scrollbar{display:none}
.nb{flex:0 0 auto;background:none;border:0;border-bottom:2.5px solid transparent;color:#7E8C8B;
  font:600 13.5px/1 var(--sans);letter-spacing:.015em;padding:13px 12px 11px;cursor:pointer;white-space:nowrap;
  transition:color .15s}
.nb:active{color:var(--star)}
.nb.on{color:var(--star);border-bottom-color:var(--fiery)}

.wrap{padding:16px 14px 0}
h2.sec{font-family:var(--sans);font-size:9.5px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dimmer);font-weight:600;margin:26px 4px 9px;display:flex;align-items:center;gap:10px}
h2.sec:first-child{margin-top:6px}
h2.sec:after{content:"";flex:1;height:1px;background:var(--line)}

/* ── cards ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;margin-bottom:9px;overflow:hidden;
  transition:border-color .2s}
.card.flag{border-color:var(--brass-dk);background:linear-gradient(180deg,rgba(201,151,63,.05),var(--panel))}
.chead{display:flex;align-items:center;gap:12px;padding:14px 15px;cursor:pointer}
.cn{flex:1;min-width:0}
.cn b{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em}
.cn i{display:block;font-style:normal;font-size:9.5px;color:var(--dimmer);letter-spacing:.11em;text-transform:uppercase;margin-top:4px}
.cl{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;white-space:nowrap;line-height:1.5}
.cl b{color:var(--chalk);font-weight:600;font-size:13px}
.cl span{display:block;font-size:8.5px;color:var(--dimmer);letter-spacing:.09em;text-transform:uppercase}
.chev{color:var(--dimmer);font-size:17px;transition:transform .2s}
.card.open .chev{transform:rotate(90deg);color:var(--fiery)}
.cbody{display:none;border-top:1px solid var(--line);padding:2px 11px 12px}
.card.open .cbody{display:block}

.srow{display:flex;align-items:flex-start;gap:7px;padding:10px 3px;border-bottom:1px solid var(--line)}
.srow:last-of-type{border-bottom:0}
.sn{width:19px;padding-top:17px;font-family:var(--mono);font-size:10px;color:var(--dimmer)}
.fg{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.fl{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--dimmer)}
.gh{font-family:var(--mono);font-size:9px;color:var(--brass-dk);height:11px;letter-spacing:.03em}
input.n{width:100%;background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;color:var(--chalk);
  font-family:var(--mono);font-size:17px;font-weight:600;text-align:center;padding:10px 2px;-moz-appearance:textfield}
input.n::-webkit-inner-spin-button,input.n::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input.n:focus{outline:none;border-color:var(--brass);background:#282d34}
input.n[type=time]{font-size:18px}
.pk{display:flex;gap:3px}
.pb{flex:1;background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;color:var(--dim);
  font-family:var(--mono);font-size:13px;font-weight:600;padding:10px 0;cursor:pointer;transition:all .12s}
.pb.on{background:var(--star);border-color:var(--star);color:#fff}
.pb.on[data-r="0"]{background:var(--fiery);border-color:var(--fiery);color:#fff}

.cue{margin:4px 3px 0;padding:9px 11px;border-radius:9px;background:rgba(249,216,207,.6);
  border:1px solid var(--peach);font-size:11.5px;color:#9C4A2E;line-height:1.5}
.cue.go{background:rgba(169,210,202,.4);border-color:var(--opal);color:#2A6B5C}

/* ── metric tiles ── */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 14px;position:relative;overflow:hidden}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--brass-dk)}
.tile.b:before{background:var(--ice)} .tile.g:before{background:var(--go)} .tile.r:before{background:var(--hot)}
.tile .k{font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dimmer);margin-bottom:9px}
.tile .v{font-family:var(--serif);font-size:27px;font-weight:600;line-height:1;letter-spacing:-.01em}
.tile .v u{text-decoration:none;font-size:12px;color:var(--dim);margin-left:2px;font-family:var(--sans);font-weight:400}
.tile .s{font-size:10px;color:var(--dim);margin-top:7px;line-height:1.45}
.tile.wide{grid-column:1/-1}

.dl{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px;border-bottom:1px solid var(--line);gap:12px}
.dl:last-child{border-bottom:0}
.dl .a{font-size:13px;color:var(--chalk)}
.dl .a u{text-decoration:none;display:block;font-size:9.5px;color:var(--dimmer);margin-top:3px;letter-spacing:.04em}
.dl .b{font-family:var(--mono);font-size:13px;color:var(--chalk);text-align:right;white-space:nowrap}
.dl .b u{text-decoration:none;display:block;font-size:9px;color:var(--dimmer);margin-top:3px}
.hi{color:var(--brass)!important} .lo{color:var(--ice)!important} .ok{color:var(--go)!important} .bad{color:var(--hot)!important}
.fig.hi{color:var(--amber)!important} .fig.ok{color:#7ee0a6!important} .fig.bad{color:#ff8f6b!important}

/* ── timeline ── */
.tl{position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:14px;width:1px;background:var(--line-2)}
.ev{position:relative;padding:0 0 20px}
.ev:before{content:"";position:absolute;left:-23px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--bg);border:1.5px solid var(--line-2)}
.ev.now:before{background:var(--brass);border-color:var(--brass);box-shadow:0 0 0 4px rgba(201,151,63,.16)}
.ev .vn{font-family:var(--mono);font-size:11px;color:var(--brass);letter-spacing:.07em}
.ev .vd{font-size:9px;color:var(--dimmer);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.ev .vt{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:7px}
.ev .vt b{color:var(--chalk);font-weight:600}


/* ── home ── */
.hero{padding:26px 6px 20px}
.hero h1{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1.05;letter-spacing:-.015em;margin:0;color:var(--star)}
.hero h1 em{display:block;font-style:italic;color:var(--fiery);font-weight:400}
.hero .hr2{height:2px;background:linear-gradient(90deg,var(--fiery),var(--disco) 40%,var(--opal) 70%,transparent);margin:15px 0 11px;width:78%}
.hero .dd{font-family:var(--mono);font-size:10.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dimmer)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:12px}
.big{position:relative;aspect-ratio:1/1;min-width:0;background:rgba(244,113,76,.16);
  border:4px solid var(--fiery);border-radius:16px;padding:16px 12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;text-align:center;color:inherit;font:inherit;
  transition:transform .09s cubic-bezier(.3,.7,.4,1), box-shadow .09s cubic-bezier(.3,.7,.4,1), filter .09s;
  box-shadow:
    0 10px 0 -1px #C4482A,
    0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(45,95,93,.22),
    0 0 34px -10px rgba(240,169,56,.55),
    inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 40px -18px rgba(244,113,76,.75)}
.big.n{background:rgba(45,95,93,.14);border-color:var(--star);
  box-shadow:
    0 10px 0 -1px #1B403F,
    0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(45,95,93,.22),
    0 0 34px -10px rgba(56,189,248,.6),
    inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 40px -18px rgba(45,95,93,.55)}
.big:active{transform:translateY(10px) scale(.985);filter:brightness(1.05) saturate(1.1);
  box-shadow:0 0 0 -1px #C4482A,0 2px 5px -4px rgba(45,95,93,.4),
    0 0 18px -10px rgba(240,169,56,.45),inset 0 3px 10px -4px rgba(0,0,0,.16),
    inset 0 0 40px -14px rgba(244,113,76,.7)}
.big.n:active{box-shadow:0 0 0 -1px #1B403F,0 2px 5px -4px rgba(45,95,93,.4),
    0 0 18px -10px rgba(56,189,248,.45),inset 0 3px 10px -4px rgba(0,0,0,.16),
    inset 0 0 40px -14px rgba(45,95,93,.6)}
.big svg{width:33px;height:33px;stroke:var(--fiery);fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;margin-bottom:10px}
.big.n svg{stroke:var(--star)}
.big .fig{font-family:var(--serif);font-size:58px;font-weight:600;line-height:.92;letter-spacing:-.03em;color:var(--star)}
.big .fig u{text-decoration:none;font-family:var(--sans);font-size:19px;color:var(--dim);font-weight:400}
.big .lbl{font-size:20px;font-weight:800;color:var(--star);margin-top:10px;letter-spacing:-.02em;line-height:1.08;
  max-width:100%;overflow-wrap:break-word}
.big .cap{max-width:100%;font-size:11px;color:var(--dim);line-height:1.4;margin-top:7px}
.big .cap b{color:var(--star);font-weight:700}

.wide{position:relative;min-width:0;background:rgba(169,210,202,.42);border:4px solid var(--opal);
  border-radius:16px;padding:16px 16px;margin-top:12px;display:flex;align-items:center;gap:15px;
  cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%;
  transition:transform .09s cubic-bezier(.3,.7,.4,1),box-shadow .09s cubic-bezier(.3,.7,.4,1),filter .09s;
  box-shadow:0 10px 0 -1px #6FA79D,0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(45,95,93,.22),inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 46px -18px rgba(120,180,170,.7)}
.wide:active{transform:translateY(10px) scale(.99);filter:brightness(1.04) saturate(1.1);
  box-shadow:0 0 0 -1px #2e6247,0 2px 5px -4px rgba(45,95,93,.4),
    inset 0 3px 10px -4px rgba(0,0,0,.16),inset 0 0 46px -14px rgba(120,180,170,.8)}
.wide svg{width:33px;height:33px;stroke:var(--star);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wide .tx{flex:1;min-width:0}
.wide .tx b{display:block;font-size:20px;font-weight:800;color:var(--star);letter-spacing:-.02em}
.wide .tx i{display:block;font-style:normal;font-size:11px;color:var(--dim);margin-top:4px}
.wide .num{text-align:right;flex:0 0 auto}
.wide .num .k{font-family:var(--serif);font-size:34px;font-weight:600;line-height:1;color:var(--star)}
.wide .num .u{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:5px}

/* food screen */
.say{background:var(--panel);border:2.5px solid var(--line-2);border-radius:14px;padding:13px;margin-bottom:12px}
.say textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;
  color:var(--chalk);font:400 15px/1.5 var(--sans);padding:12px;resize:none;min-height:76px}
.say textarea:focus{outline:none;border-color:var(--go)}
.say .hintl{font-size:10px;color:var(--dimmer);margin:9px 2px 0;line-height:1.5}
.say .row{display:flex;gap:8px;margin-top:10px}
.say .go2{flex:1;background:linear-gradient(180deg,#BFDFD8,var(--opal));border:0;border-radius:10px;color:var(--star);
  font:700 14px var(--sans);padding:13px 0;cursor:pointer}
.say .go2.n{background:linear-gradient(180deg,#4C8583,var(--star));color:#fff}
.say .clr{flex:0 0 auto;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:10px;
  color:var(--dim);font:600 13px var(--sans);padding:13px 15px;cursor:pointer}
.conf{border:2px solid var(--opal);border-radius:12px;padding:12px;margin-top:11px;background:rgba(169,210,202,.28)}
.conf.n{border-color:var(--star);background:rgba(45,95,93,.08)}
.conf h4{margin:0 0 9px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--star);font-weight:700}
.conf.n h4{color:var(--star)}
.conf .ci{display:flex;align-items:center;gap:9px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.conf .ci:last-of-type{border-bottom:0}
.conf .ci .nm{flex:1;font-size:13.5px}
.conf .ci .nm u{text-decoration:none;display:block;font-size:10px;color:var(--dimmer);margin-top:2px}
.conf .ci input{width:52px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:8px;
  color:var(--chalk);font-family:var(--mono);font-size:14px;text-align:center;padding:7px 2px}
.conf .ci .drop{background:none;border:0;color:var(--hot);font-size:17px;padding:4px 6px;cursor:pointer}
.conf .miss{font-size:11.5px;color:var(--hot);padding:7px 2px}
.wide.w2{background:rgba(245,160,220,.26);border-color:var(--disco);
  box-shadow:0 10px 0 -1px #C46FA8,0 11px 0 -1px rgba(255,255,255,.10),
    0 18px 26px -8px rgba(45,95,93,.22),inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 46px -18px rgba(245,160,220,.7)}
.wide.w2:active{box-shadow:0 0 0 -1px #C46FA8,0 2px 5px -4px rgba(45,95,93,.4),
    inset 0 3px 10px -4px rgba(0,0,0,.16),inset 0 0 46px -14px rgba(245,160,220,.8)}
.wide.w2 svg{stroke:#B0498E}
.exw{border-bottom:1px solid var(--line)}
.exw .dl{border-bottom:0}
.exc{padding:0 0 10px}
.chart{position:relative;background:linear-gradient(165deg,color-mix(in srgb,var(--ac) 14%,var(--panel)),var(--panel) 62%);
  border:2.5px solid color-mix(in srgb,var(--ac) 58%,transparent);border-radius:16px;
  padding:14px 12px 8px;margin-bottom:12px;overflow:hidden;
  box-shadow:0 6px 0 -1px rgba(45,95,93,.14),0 14px 22px -10px rgba(45,95,93,.22),
    inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 0 50px -20px var(--ac)}
.chart .ch{display:flex;align-items:center;gap:8px;padding:0 2px 2px}
.chart .dotc{width:8px;height:8px;border-radius:50%;background:var(--ac);
  box-shadow:0 0 10px 1px var(--ac);flex:0 0 auto}
.chart .ch b{flex:1;font-size:13.5px;font-weight:800;color:var(--star);letter-spacing:-.01em}
.chart .delta{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 8px;border-radius:20px;
  background:rgba(45,95,93,.08);color:var(--dim)}
.chart .delta.up{color:#2A6B5C;background:rgba(169,210,202,.5)}
.chart .delta.dn{color:#C4482A;background:rgba(249,180,156,.5)}
.chart .cnow{display:flex;align-items:baseline;gap:9px;padding:6px 2px 8px}
.chart .cv{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1;color:var(--star)}
.chart .cs{font-size:10px;color:var(--dim);line-height:1.4}
.spk{width:100%;height:100px;display:block}
.cx{display:flex;justify-content:space-between;font-size:9px;color:var(--dimmer);
  padding:4px 2px 4px;font-family:var(--mono)}
.imp{border:2.5px dashed var(--line-2);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--panel)}
.imp .ih{display:flex;align-items:center;gap:9px;cursor:pointer}
.imp .ih b{flex:1;font-size:13.5px;font-weight:700}
.imp .ih span{font-size:17px;color:var(--dimmer);transition:transform .18s}
.imp.open .ih span{transform:rotate(90deg);color:var(--brass)}
.imp .ib{display:none;margin-top:12px}
.imp.open .ib{display:block}
.imp textarea{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;
  color:var(--chalk);font:400 13px/1.5 var(--mono);padding:11px;resize:none;min-height:92px}
.imp textarea:focus{outline:none;border-color:var(--brass)}
.imp .btns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.imp .fbtn{flex:1;min-width:96px;background:var(--panel-2);border:1.5px solid var(--line-2);border-radius:10px;
  color:var(--chalk);font:600 12.5px var(--sans);padding:12px 6px;cursor:pointer;text-align:center}
.imp .fbtn:active{background:var(--line)}
.imp .run{width:100%;margin-top:9px;background:linear-gradient(180deg,var(--brass-2),var(--brass));border:0;
  border-radius:10px;color:#17191c;font:700 13.5px var(--sans);padding:13px 0;cursor:pointer}
.imp .fmt{font-size:10px;color:var(--dimmer);line-height:1.6;margin-top:9px}
.imp .fmt code{font-family:var(--mono);color:var(--dim)}
.imp .stat{font-size:11.5px;margin-top:9px;line-height:1.5}
.wide.w3{background:rgba(201,153,15,.20);border-color:var(--goldie);
  box-shadow:0 10px 0 -1px #8E6B08,0 11px 0 -1px rgba(255,255,255,.5),
    0 18px 26px -8px rgba(45,95,93,.22),inset 0 1.5px 0 rgba(255,255,255,.6),
    inset 0 0 46px -18px rgba(201,153,15,.6)}
.wide.w3:active{box-shadow:0 0 0 -1px #8E6B08,0 2px 5px -4px rgba(45,95,93,.4),
    inset 0 3px 10px -4px rgba(0,0,0,.16),inset 0 0 46px -14px rgba(201,153,15,.7)}
.wide.w3 svg{stroke:#8E6B08}
.mac{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.mc{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center}
.mc .v{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.mc .k{font-size:8px;letter-spacing:.11em;text-transform:uppercase;color:var(--dimmer);margin-top:6px}
.mc .t{font-size:8.5px;color:var(--dimmer);margin-top:3px}
.pbar{height:5px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:7px}
.pbar i{display:block;height:100%;background:var(--opal);border-radius:3px}

const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,
  half:0.5,"a half":0.5,quarter:0.25,couple:2,"a couple":2,double:2,dozen:12,"a dozen":12};
function numFrom(t){
  const f=t.match(/(\d+(?:\.\d+)?)\s*(?:and\s*a\s*half)?/);
  if(/and a half/.test(t)&&f) return parseFloat(f[1])+0.5;
  if(f) return parseFloat(f[1]);
  const order=["a dozen","dozen","a couple","couple","half","quarter","double","ten","nine","eight","seven","six","five","four","three","two","one","an","a"];
  for(const w of order){ if(NUMW[w]!=null && new RegExp("\\b"+w+"\\b").test(t)) return NUMW[w]; }
  return null;
}
function to24(h,m,mer){
  h=+h; m=m?+m:0;
  if(mer){ mer=mer.toLowerCase().replace(/\./g,"");
    if(mer.startsWith("p")&&h<12) h+=12;
    if(mer.startsWith("a")&&h===12) h=0; }
  return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
}
function parseSleep(raw){
  const t=" "+raw.toLowerCase().replace(/[,]/g," ")+" ";
  let bed=null,wake=null,hrs=null,q=null;
  const span=/\b(h\b|hr|hrs|hour)/.test(t)&&!/(a\.?m|p\.?m|:\d{2})/.test(t) ? null : t.match(/(?:from\s*)?(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?\s*(?:to|until|till|-|–|and woke(?:\s*up)?(?:\s*at)?)\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?/);
  if(span){
    let b=+span[1], w=+span[4];
    let bm=span[3], wm=span[6];
    if(!bm) bm = (b>=8&&b<=11)||b===12 ? "pm" : (b<=7?"pm":"pm");
    if(!wm) wm = (w>=1&&w<=11) ? "am" : "am";
    bed=to24(span[1],span[2],bm); wake=to24(span[4],span[5],wm);
  } else {
    const bm=t.match(/(?:bed|lights out|went to bed|asleep)\s*(?:at)?\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?!\s*(?:h\b|hr|hour|min))/);
    const wm=t.match(/(?:woke|awake|got up)\s*(?:up)?\s*(?:at)?\s*(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?(?!\s*(?:h\b|hr|hour|min))/);
    if(bm) bed=to24(bm[1],bm[2],bm[3]||((+bm[1]>=8||+bm[1]<=1)?"pm":"pm"));
    if(wm) wake=to24(wm[1],wm[2],wm[3]||"am");
  }
  const hm=t.match(/(\d+(?:\.\d+)?)\s*(?:and\s*a\s*half\s*)?(?:h\b|hr|hrs|hour)/);
  if(hm){ hrs=parseFloat(hm[1]); if(/and a half/.test(t)) hrs+=0.5; }
  else { const wn=t.match(/\b([a-z]+)\s*(?:and\s*a\s*half\s*)?hours?\b/);
    if(wn&&NUMW[wn[1]]!=null){ hrs=NUMW[wn[1]]; if(/and a half\s*hour/.test(t)) hrs+=0.5; } }
  const mins=t.match(/(\d+)\s*min/); if(hrs!=null&&mins) hrs+=(+mins[1])/60;

  if(/\b(terrible|awful|dreadful|horrible|very badly|really bad)\b/.test(t)) q=1;
  else if(/\b(bad|badly|poor|poorly|rough|restless|broken)\b/.test(t)) q=2;
  else if(/\b(ok|okay|alright|average|fine|so so|decent)\b/.test(t)) q=3;
  else if(/\b(good|well|solid|fairly well|quite well|pretty well)\b/.test(t)) q=4;
  else if(/\b(great|excellent|amazing|perfect|deep|best)\b/.test(t)) q=5;
  const qn=t.match(/quality\s*(?:of)?\s*([1-5])/); if(qn) q=+qn[1];
  return {bed,wake,hrs,q};
}
function bestFood(phrase,db){
  phrase=phrase.replace(/\btoast\b/gi,"bread").replace(/\bchicken breasts?\b/gi,"chicken breast");
  const words=phrase.toLowerCase().replace(/[^a-z ]/g," ").split(/\s+/)
    .filter(w=>w.length>2 && !["the","and","some","with","was","had","ate","eat","for","cup","cups","bowl","plate","serving","servings","of","food","meal","today","lunch","dinner","breakfast","snack"].includes(w));
  if(!words.length) return null;
  let best=null,score=0;
  db.forEach(f=>{
    const n=f.n.toLowerCase(); let s=0;
    words.forEach(w=>{
      if(n.includes(w)) s+=2;
      else if(w.endsWith("s")&&n.includes(w.slice(0,-1))) s+=2;
      else if(n.split(/[^a-z]+/).some(p=>p.startsWith(w.slice(0,4)))) s+=1;
    });
    const head=n.split(",")[0].trim().split(/\s+/);
    words.forEach(w=>{ if(head[0]===w||head[0]===w.replace(/s$/,"")) s+=3;
                       else if(head.includes(w)) s+=1; });
    if(n.split(",")[0].trim()===words.join(" ")) s+=3;
    if(s>score){score=s;best=f;}
  });
  return score>=2?{food:best,score:score}:null;
}
function parseFood(raw,db){
  if(/\b(no|nothing|didn'?t|did not|skipped|none)\b/.test(raw.toLowerCase())&&!/\d/.test(raw)) return [];
  const parts=raw.toLowerCase()
    .replace(/\b(i|had|ate|eat|for|breakfast|lunch|dinner|snack|today|just|then|also)\b/g," ")
    .split(/\s*(?:,|\band\b|\bplus\b|\bwith\b|\bon\b|\bover\b|\balong\b|\+|;|&)\s*/)
    .map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(p=>{
    const m=bestFood(p,db); if(!m) { out.push({raw:p,food:null,qty:1}); return; }
    let q=numFrom(p); if(q==null) q=1;
    out.push({raw:p,food:m.food,qty:q});
  });
  return out;
}

function parseWeight(raw){
  const t=" "+raw.toLowerCase().replace(/,/g," ")+" ";
  let w=null,unit=null,bf=null;
  let m=t.match(/(\d{2,3}(?:\.\d+)?)\s*(lbs?|pounds?|kgs?|kilos?|kilograms?)/);
  if(m){ w=parseFloat(m[1]); unit=/k/.test(m[2])?"kg":"lb"; }
  else { const n=t.match(/(?:weigh(?:ed|t)?|was|am|at)\s*(\d{2,3}(?:\.\d+)?)/);
         if(n){ w=parseFloat(n[1]); unit=w<100?"kg":"lb"; }
         else { const b=t.match(/\b(\d{2,3}(?:\.\d+)?)\b/); if(b){ w=parseFloat(b[1]); unit=w<100?"kg":"lb"; } } }
  const f=t.match(/(\d{1,2}(?:\.\d+)?)\s*%?\s*(?:body\s*fat|bf|fat)/) || t.match(/(?:body\s*fat|bf)\s*(?:of|at|is)?\s*(\d{1,2}(?:\.\d+)?)/);
  if(f) bf=parseFloat(f[1]);
  if(w==null) return null;
  if(unit==="kg") w=w*2.20462;
  if(w<80||w>400) return null;
  return {lb:Math.round(w*10)/10, bf:bf};
}

function parseStrength(raw,plan){
  const t=raw.trim(); if(!t) return null;
  const all=[]; Object.keys(plan||{}).forEach(d=>plan[d].ex.forEach(e=>all.push({n:e.n,day:d})));
  const low=t.toLowerCase();
  let hit=null,score=0;
  all.forEach(e=>{const n=e.n.toLowerCase();
    let s=0; n.split(/\s+/).forEach(w=>{if(w.length>2&&low.includes(w))s+=2;});
    if(low.includes(n))s+=4;
    if(s>score){score=s;hit=e;}});
  if(!hit||score<2) return null;
  const sets=[];
  const pairs=t.match(/(\d+(?:\.\d+)?)\s*(?:x|×|\*|for|@)\s*(\d+)/gi)||[];
  pairs.forEach(p=>{const m=p.match(/(\d+(?:\.\d+)?)\s*(?:x|×|\*|for|@)\s*(\d+)/i);
    if(m) sets.push({w:parseFloat(m[1]),r:parseInt(m[2])});});
  if(!sets.length){
    const w=t.match(/(\d{2,3}(?:\.\d+)?)\s*(?:lbs?|pounds?)?/);
    const r=t.match(/(\d{1,2})\s*(?:reps?)/i);
    if(w&&r) sets.push({w:parseFloat(w[1]),r:parseInt(r[1])});
  }
  if(!sets.length) return null;
  return {n:hit.n,day:hit.day,sets:sets};
}

function load(){

  if(!o.plan||typeof o.plan!=="object") o.plan=fresh;

    d.label=d.label||fresh[k].label; d.sub=d.sub||fresh[k].sub;
    d.ex=d.ex.filter(e=>e&&typeof e.n==="string");
    fresh[k].ex.forEach(se=>{ if(!d.ex.some(e=>e.n===se.n)) d.ex.push(se); });

  Object.keys(o.plan).forEach(k=>{ if(!fresh[k]&&(!o.plan[k]||!Array.isArray(o.plan[k].ex))) delete o.plan[k]; });

  o.sessions=Array.isArray(o.sessions)?o.sessions.filter(s=>s&&s.date&&Array.isArray(s.sets)

function mergeStored(mine){
  let theirs=null;
  try{const r=localStorage.getItem(K); if(r) theirs=JSON.parse(r);}catch(e){}
  if(!theirs||typeof theirs!=="object") return mine;
  const out=JSON.parse(JSON.stringify(mine));
  out._del=Array.from(new Set((out._del||[]).concat(theirs._del||[])));
  const dead=new Set(out._del);
  const wipe=Math.max(out._wipe||0, theirs._wipe||0);
  out._wipe=wipe;
  // if this copy wiped, drop anything older than the wipe
  ["sessions","food","sleep","weight"].forEach(k=>{
    out[k]=(out[k]||[]).filter(x=>x && !dead.has(x._id) && !(wipe && (x._t||0)<wipe));
  });
  ["sessions","food"].forEach(k=>{
    const seen=new Set(out[k].map(x=>x._id).filter(Boolean));
    (theirs[k]||[]).forEach(x=>{
      if(!x||!x._id) return;
      if(dead.has(x._id)) return;
      if(wipe && (x._t||0)<wipe) return;
      if(!seen.has(x._id)) out[k].push(x);
    });
    out[k].sort((a,b)=>(a.date<b.date?-1:1));
  });
  ["sleep","weight"].forEach(k=>{
    const dates=new Set(out[k].map(x=>x.date));
    (theirs[k]||[]).forEach(x=>{
      if(!x||!x.date) return;
      if(dead.has(x._id)) return;
      if(wipe && (x._t||0)<wipe) return;
      if(!dates.has(x.date)) out[k].push(x);
    });
    out[k].sort((a,b)=>(a.date<b.date?-1:1));
  });
  const names=new Set((out.customFoods||[]).map(x=>x&&x.n&&x.n.toLowerCase()));
  (theirs.customFoods||[]).forEach(x=>{ if(x&&x.n&&!names.has(x.n.toLowerCase())) out.customFoods.push(x); });
  return out;
}

      if(R>0&&R<=lim) sets.push({n:n,set:i+1,w:0,r:R,rir:s.rir??null,k:kind});
      else if(s.r!=null) rejected++; }}));
  if(!sets.length){toast(rejected?"Check those numbers":"Nothing to save");return;}
  if(rejected){toast(rejected+" set"+(rejected>1?"s":"")+" skipped — out of range");}
  DB.sessions.push({date:new Date().toISOString(),day:day,sets:sets});save();clearDraft();render();toast("Saved "+sets.length+" sets");}

/* ---------- CHARTS ---------- */
function spark(pts,o){
  o=o||{};
  const CAP=o.cap||120;
  let ma=null;
  if(o.avg&&pts.length>2){
    const k=o.avgN||7;
    ma=pts.map((_,i)=>{const s=pts.slice(Math.max(0,i-k+1),i+1);
      return s.reduce((a,b)=>a+b.v,0)/s.length;});
  }
  if(pts.length>CAP){ const step=pts.length/CAP; const t=[],tm=[];
    for(let i=0;i<CAP;i++){const j=Math.floor(i*step); t.push(pts[j]); if(ma) tm.push(ma[j]);}
    t[CAP-1]=pts[pts.length-1]; if(ma) tm[CAP-1]=ma[ma.length-1];
    pts=t; if(ma) ma=tm; } const W=o.w||330,H=o.h||100,P=8,B=16;
  if(!pts.length) return "";
  const ys=pts.map(p=>p.v).concat(ma||[]);
  let lo=Math.min(...ys), hi=Math.max(...ys);
  if(o.target!=null){lo=Math.min(lo,o.target);hi=Math.max(hi,o.target);}
  if(hi===lo){hi=lo+1;lo=lo-1;}
  const pad=(hi-lo)*0.18; lo-=pad; hi+=pad;
  const X=i=>P+(i/Math.max(1,pts.length-1))*(W-P*2);
  const Y=v=>H-B-((v-lo)/(hi-lo))*(H-B-P);
  const d=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const area=d+` L ${X(pts.length-1).toFixed(1)} ${H-B} L ${X(0).toFixed(1)} ${H-B} Z`;
  const c=o.color||"#63a882", c2=o.color2||c, id=o.id||0;
  const grid=[0.25,0.5,0.75].map(f=>`<line x1="${P}" y1="${(P+(H-B-P)*f).toFixed(1)}" x2="${W-P}" y2="${(P+(H-B-P)*f).toFixed(1)}"
    stroke="rgba(45,95,93,.07)" stroke-width="1"/>`).join("");
  let avg="";
  if(ma){
    avg=`<path d="${ma.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ")}"
      fill="none" stroke="rgba(45,95,93,.55)" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>`;}
  let tgt="";
  if(o.target!=null) tgt=`<line x1="${P}" y1="${Y(o.target).toFixed(1)}" x2="${W-P}" y2="${Y(o.target).toFixed(1)}"
      stroke="#2D5F5D" stroke-opacity=".3" stroke-width="1.4" stroke-dasharray="3 5"/>
    <text x="${W-P}" y="${(Y(o.target)-5).toFixed(1)}" text-anchor="end" font-size="8.5"
      fill="rgba(45,95,93,.55)" font-family="ui-monospace,monospace">${o.targetLabel||o.target}</text>`;
  const dots=pts.map((p,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="2.6"
      fill="${c}" fill-opacity=".55"/>`).join("");
  const last=pts[pts.length-1], lx=X(pts.length-1), ly=Y(last.v);
  const dp=o.dp!=null?o.dp:1;
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="ga${id}" x1="0" x2="0" y1="0" y2="1">
        <stop offset="0" stop-color="${c}" stop-opacity=".45"/>
        <stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient>
      <linearGradient id="gs${id}" x1="0" x2="1" y1="0" y2="0">
        <stop offset="0" stop-color="${c2}"/><stop offset="1" stop-color="${c}"/></linearGradient>
      <filter id="gl${id}" x="-30%" y="-60%" width="160%" height="260%">
        <feGaussianBlur stdDeviation="3.4" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${grid}
    <path d="${area}" fill="url(#ga${id})"/>${tgt}
    <path d="${d}" fill="none" stroke="url(#gs${id})" stroke-width="3" stroke-linejoin="round"
      stroke-linecap="round" filter="url(#gl${id})"/>
    ${avg}${dots}
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="8" fill="${c}" fill-opacity=".22"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="4.4" fill="${c}" filter="url(#gl${id})"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="1.8" fill="#fff"/>
  </svg>`;}

function chartCard(title,sub,pts,o){
  o=o||{};
  const total=pts.length;
  if(pts.length<2) return `<div class="chart"><div class="ch"><b>${title}</b><i>needs at least two entries</i></div></div>`;
  const first=pts[0].v,last=pts[pts.length-1].v,d=last-first;
  const dp=o.dp!=null?o.dp:1;
  if(total>120) sub=sub+" · showing a sample";
  const good=o.invert? d<0 : d>0;
  const col=o.color||"#63a882";
  return `<div class="chart" style="--ac:${col}">
    <div class="ch"><span class="dotc"></span><b>${title}</b>
      <span class="delta ${d===0?"":good?"up":"dn"}">${d>0?"▲ +":d<0?"▼ ":"— "}${d===0?"":Math.abs(d).toFixed(dp)}</span></div>
    <div class="cnow"><span class="cv">${last.toFixed(dp)}</span><span class="cs">${sub}</span></div>
    ${spark(pts,o)}
    <div class="cx"><span>${pts[0].l}</span><span>${pts[pts.length-1].l}</span></div></div>`;}

function splitRows(txt){
  return txt.trim().split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length);
}
function runImport(kind,txt,stat){
  if(!txt||!txt.trim()){stat.style.color="var(--hot)";stat.textContent="Nothing to read.";return;}
  const lines=splitRows(txt.replace(/^\uFEFF/,""));
  const DELIM = /\t/.test(txt) ? "\t" : (/;/.test(txt)&&!/,/.test(txt) ? ";" : ",");
  const isCSV = lines.filter(l=>l.includes(DELIM)).length >= Math.max(1,lines.length*0.6);
  const today = dkey();
  const normDate = s => {
    s=(s||"").trim();
    let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return m[0];
    m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if(m){ const a=+m[1],bb=+m[2];
      const mo = a>12 ? bb : a, dd = a>12 ? a : bb;   // ambiguous: assume M/D/Y
      return m[3]+"-"+String(mo).padStart(2,"0")+"-"+String(dd).padStart(2,"0"); }
    return null;};
  let added=0, skipped=0, out=[];
  const push=(rec)=>{out.push(rec);};

  lines.forEach(line=>{
    if(/^\uFEFF?(date|day)\b/i.test(line)) return;
    if(isCSV && line.includes(DELIM)){
      const c=line.split(DELIM).map(x=>x.trim().replace(/^"|"$/g,""));
      const d=normDate(c[0]);
      if(d && d>today){ skipped++; return; }
      if(kind==="sleep"&&d&&c[1]&&c[2]){ const hh=+c[3]||hrs(c[1],c[2]);
        if(hh>0&&hh<=16) push({date:d,bed:c[1],wake:c[2],hrs:hh,q:c[4]?+c[4]:null}); else skipped++; return; }
      if(kind==="weight"&&d&&c[1]){ const lb=+c[1]; if(lb>=80&&lb<=400) push({date:d,lb:lb,bf:c[2]?+c[2]:null}); else skipped++; return; }
      if(kind==="strength"&&d&&c[2]){ const W=+c[4],R=+c[5];
        if(W>0&&W<=2000&&R>0&&R<=100) push({date:d,day:c[1]||"D1",n:c[2],set:+c[3]||1,w:W,r:R,rir:c[6]===""?null:+c[6]});
        else skipped++; return; }
      if(kind==="food"&&d&&c[1]){ push({date:d,n:c[1],q:+c[2]||1,unit:c[3]||"serving",
        kcal:+c[4]||0,p:+c[5]||0,c:+c[6]||0,f:+c[7]||0,s:+c[8]||0}); return; }
      skipped++; return;
    }
    // free text, one entry per line
    if(kind==="sleep"){ const r=parseSleep(line);
      if(r.bed&&r.wake){push({date:dkey(),bed:r.bed,wake:r.wake,hrs:hrs(r.bed,r.wake),q:r.q}); return;} skipped++; return; }
    if(kind==="weight"){ const r=parseWeight(line);
      if(r){push({date:dkey(),lb:r.lb,bf:r.bf}); return;} skipped++; return; }
    if(kind==="strength"){ const r=parseStrength(line,DB.plan);
      if(r&&r.sets.length){ r.sets.forEach((s,i)=>push({date:dkey(),day:r.day,n:r.n,set:i+1,w:s.w,r:s.r,rir:s.rir??null})); return; }
      skipped++; return; }
    if(kind==="food"){ parseFood(line,(DB.customFoods||[]).concat(FOODDB)).forEach(x=>{
        if(!x.food){skipped++;return;} const g=x.food.sg*x.qty;
        push({date:dkey(),n:x.food.n,q:x.qty,unit:x.food.sl,kcal:x.food.kcal*g/100,p:x.food.p*g/100,
              c:x.food.c*g/100,f:x.food.f*g/100,s:x.food.s*g/100});}); return; }
    skipped++;
  });

  if(!out.length){stat.style.color="var(--hot)";
    stat.textContent="Nothing recognised. Check the column order, or paste one entry per line.";return;}
  stat.style.color="var(--go)";
  stat.innerHTML=`Found <b>${out.length}</b> entr${out.length>1?"ies":"y"}${skipped?` · ${skipped} line${skipped>1?"s":""} skipped`:""}.
    <button class="run" id="impgo" style="margin-top:9px">Add ${out.length} to history</button>`;
  document.getElementById("impgo").onclick=()=>{
    if(kind==="sleep"){DB.sleep=DB.sleep||[];

function wireFood(){

    const hits=all.filter(f=>f.n.toLowerCase().includes(t)).slice(0,12);
    res.innerHTML = hits.map((f,i)=>`<div class="fr" data-i="${i}">
        <span class="fn"><b>${esc(f.n)}</b><i>${esc(f.sl)} · ${Math.round(f.kcal*f.sg/100)} kcal · ${Math.round(f.p*f.sg/100)}g protein</i></span>

      || `<div class="fr"><span class="fn"><b>No match</b><i>Add "${esc(q.value.trim())}" with your own numbers</i></span>
           <button class="add" data-new="1">+</button></div>`;
    res.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>pick(hits[+b.dataset.pick]));

function pick(f){
  const n=prompt(`How many ${f.sl.replace(/^1\s+/,"")}?  (1 = ${f.sg} g)`,"1");
  if(n===null) return; const q=parseFloat(n); if(!q||q<=0) return;
  const g=f.sg*q;
  DB.food=DB.food||[];
  DB.food.push({date:dkey(),n:f.n,q:q,unit:f.sl,
    kcal:f.kcal*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100,s:f.s*g/100});
  save(); render(); toast(f.n+" added");
}
function addCustom(name){
  const kcal=parseFloat(prompt("Calories per serving?","")); if(!kcal) return;
  const p=parseFloat(prompt("Protein grams?","0"))||0;
  const c=parseFloat(prompt("Carb grams?","0"))||0;
  const f=parseFloat(prompt("Fat grams?","0"))||0;
  const s=parseFloat(prompt("Sugar grams?","0"))||0;
  const rec={n:name,kcal:kcal,p:p,c:c,f:f,s:s,sg:100,sl:"1 serving"};
  DB.customFoods=DB.customFoods||[]; if(!DB.customFoods.some(x=>x.n.toLowerCase()===name.toLowerCase())) DB.customFoods.push(rec);
  DB.food=DB.food||[];
  DB.food.push({date:dkey(),n:name,q:1,unit:"serving",kcal:kcal,p:p,c:c,f:f,s:s});
  save(); render(); toast(name+" saved to your foods");
}

     return `<div class="dl" style="display:block"><div style="display:flex;align-items:baseline;gap:10px">
       <span class="a" style="flex:1;color:var(--brass);font-family:var(--mono);font-size:11px">${new Date(s.date).toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})} · ${esc(s.day)}</span>
       <button class="drop" data-sess="${idx}" style="color:var(--hot);background:none;border:0;font-size:16px;padding:2px 6px;cursor:pointer">×</button></div>
       <div style="font-size:12px;color:var(--dim);margin-top:6px;line-height:1.7">${Object.entries(by).map(([k,v])=>esc(k)+" "+v.join(", ")).join("<br>")}</div></div>`;}).join("")+
   `<div style="padding:20px 4px"><button class="del" id="wipe">Erase all data</button></div></div>`;}

function csv(){const rows=[["date","day","exercise","set","weight","reps","rir","est1rm"]];
  DB.sessions.forEach(s=>s.sets.forEach(x=>rows.push([dkey(new Date(s.date)),s.day,x.n,x.set,x.w,x.r,x.rir??"",e1rm(x.w,x.r).toFixed(1)])));
  let out=rows.map(r=>r.join(",")).join("\n");
  if(DB.sleep.length)out+="\n\ndate,bedtime,wake,hours,quality\n"+DB.sleep.map(s=>[s.date,s.bed,s.wake,s.hrs.toFixed(2),s.q??""].join(",")).join("\n");
  if((DB.food||[]).length)out+="\n\ndate,food,qty,unit,kcal,protein,carbs,fat,sugar\n"+DB.food.map(f=>[f.date,'"'+f.n+'"',f.q,f.unit,f.kcal.toFixed(0),f.p.toFixed(1),f.c.toFixed(1),f.f.toFixed(1),f.s.toFixed(1)].join(",")).join("\n");
  if((DB.weight||[]).length)out+="\n\ndate,weight_lb,bodyfat_pct\n"+DB.weight.map(w=>[w.date,w.lb,w.bf??""].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out],{type:"text/csv"}));
  a.download="strength_and_sleep_log_"+dkey()+".csv";a.click();toast("Exported");}
document.addEventListener("click",e=>{if(e.target.id==="wipe"&&confirm("Erase every logged session and night?")){
  DB={plan:JSON.parse(JSON.stringify(SEED)),sessions:[],sleep:[],food:[],customFoods:[],weight:[],
      _del:[],_wipe:Date.now()+1};save();tab=day;render();toast("Erased");}});
document.getElementById("hm").onclick=()=>{tab="home";render();};
window.addEventListener("storage",e=>{ if(e.key===K){ DB=load(); render(); toast("Updated from another window"); }});
render();
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener("statechange",()=>{
        if(nw.state==="installed"&&navigator.serviceWorker.controller){
          const bar=document.createElement("div");
          bar.style.cssText="position:fixed;left:12px;right:12px;bottom:96px;z-index:70;background:var(--fiery);"+
            "color:#fff;font:700 13.5px var(--sans);padding:14px 16px;border-radius:12px;display:flex;"+
            "align-items:center;gap:12px;box-shadow:0 8px 24px -8px rgba(0,0,0,.7)";
          bar.innerHTML='<span style="flex:1">A newer version is ready.</span>'+
            '<button style="background:#fff;color:#F4714C;border:0;border-radius:8px;font:700 12.5px var(--sans);padding:9px 14px">Update</button>';
          bar.querySelector("button").onclick=()=>{ nw.postMessage({type:"SKIP_WAITING"}); };
          document.body.appendChild(bar);
        }});});
    setInterval(()=>reg.update().catch(()=>{}), 60*60*1000);
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(reloaded) return; reloaded=true; location.reload();});
}
</script>
